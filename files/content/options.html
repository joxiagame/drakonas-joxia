<h1 class="text-center">Options</h1>
<div class="input">
    <strong>
        Qualité
    </strong>
    <input type="radio" name="quality" value="high" id="SettingsQualityHigh">  <label for="SettingsQualityHigh">Haute</label>
    <input type="radio" name="quality" value="low" id="SettingsQualityLow"> <label for="SettingsQualityLow">Basse</label>
</div>
<div class="input">
    <strong>
        Musique
    </strong>
    <input type="radio" name="music" id="SettingsMusicOn"> <label for="SettingsMusicOn">Oui</label>
    <input type="radio" name="music" id="SettingsMusicOff"> <label for="SettingsMusicOff">Non</label>
</div>
<div class="input">
    <strong>
        Effets sonores
    </strong>
    <input type="radio" name="effects" id="SettingsEffectsOn"> <label for="SettingsEffectsOn">Oui</label>
    <input type="radio" name="effects" id="SettingsEffectsOff"> <label for="SettingsEffectsOff">Non</label>
</div>
<div class="input">
    <strong>
        Commandes
    </strong>
    <input type="radio" name="controls" id="SettingsControlsMouse"> <label for="SettingsControlsMouse">Souris</label>
    <input type="radio" name="controls" id="SettingsControlsKeyboard" disabled> <label for="SettingsControlsKeyboard">Clavier</label>
</div>
<input type="submit" id="SaveSettings" class="btn btn-primary" value="Enregistrer">
